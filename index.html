<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Frontend</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; font-weight: bold; }
        input { width: 100%; padding: .5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: .7rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        .error-message { color: red; font-size: 0.9rem; margin-top: 1rem; display: none; }
        .success-message { color: green; font-size: 0.9rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="******">
        </div>
        <button type="submit" id="btnSubmit">Ingresar</button>
    </form>
    
    <!-- Mensajes de feedback para el usuario -->
    <div id="errorBox" class="error-message"></div>
    <div id="successBox" class="success-message"></div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const btnSubmit = document.getElementById('btnSubmit');

    loginForm.addEventListener('submit', async (event) => {
        // 1. Evitar que la página se recargue al enviar el formulario
        event.preventDefault(); 
        
        // Limpiar mensajes anteriores y deshabilitar botón
        ocultarMensajes();
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Cargando...';

        // 2. Capturar los valores de los inputs
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // 3. Hacer el fetch al backend local
            const respuesta = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const datos = await respuesta.json();

            // 4. Si el backend responde con error (400, 401, 500...)
            if (!respuesta.ok) {
                throw new Error(datos.error || 'Error inesperado en el servidor');
            }

            // 5. Si la respuesta es exitosa (200 OK)
            successBox.innerText = `¡Bienvenido, ${datos.usuario.email}!`;
            successBox.style.display = 'block';
            loginForm.reset(); // Limpia los campos del formulario

        } catch (error) {
            // 6. Capturar y mostrar el error exacto que envió tu backend
            errorBox.innerText = error.message;
            errorBox.style.display = 'block';
        } finally {
            // Reestablecer el botón al terminar la petición
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Ingresar';
        }
    });

    function ocultarMensajes() {
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
    }
</script>

</body>
</html>
