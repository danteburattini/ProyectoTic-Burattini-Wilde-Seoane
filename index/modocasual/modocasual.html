
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Modo Casual</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>

<body class="paginaCasual">

    <header class="headerCasual">
        <a href="../home/home.html">
            <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
        </a>

        <h1>MODO CASUAL</h1>
    </header>

    <main class="fondoCasual">

        <section class="panelCasual" aria-labelledby="tituloTiempoCasual">

            <h2 class="tituloTiempo" id="tituloTiempoCasual">TIEMPO</h2>

            <div class="opcionesTiempo">
                <button type="button" id="tiempoSi" aria-pressed="true" class="botonTiempo seleccionado">
                    SÍ
                </button>

                <span class="separadorTiempo"></span>

                <button type="button" id="tiempoNo" aria-pressed="false" class="botonTiempo">
                    NO
                </button>
            </div>

            <div class="tiempoCasual" id="tiempoCasual">
                <output id="minutosCasual" for="barraMinutos">9 MIN</output>
                <input type="range" id="barraMinutos" aria-label="Minutos de juego" min="1" max="10" value="9">
            </div>

            <button type="button" id="crearDesafio" class="amigoCasual">
                <span>Enfrentarte a un amigo</span>
                <span class="iconoCopiar" aria-hidden="true">▢</span>
            </button>

            <section id="invitacionDesafio" aria-label="Invitación" hidden>
                <label for="enlaceAmigo">Mandale este enlace a tu amigo</label>
                <input type="url" id="enlaceAmigo" readonly>
                <button type="button" id="copiarDesafio">Copiar enlace</button>
                <a id="jugarDesafio">Empezar mi partida</a>
                <p id="avisoLocal" hidden>Con localhost, el enlace solo funciona en esta compu.</p>
            </section>
            <p id="estadoDesafio" role="status"></p>

            <a href="../tutorial/tutorial.html?desde=casual" class="tutorialCasual">
                ¿CÓMO SE JUEGA?
            </a>

            <a href="../juego/juego.html" class="botonJugarCasual" id="jugarCasual">
                JUGAR
            </a>

        </section>

    </main>

    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="modocasual.js"></script>
</body>
</html>
