
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Modo Casual</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>

<body class="pagina-casual">

    <header class="header-casual">
        <a href="../home/home.html">
            <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
        </a>

        <h1>MODO CASUAL</h1>
    </header>

    <main class="fondo-casual">

        <section class="panel-casual" aria-labelledby="titulo-tiempo-casual">

            <h2 class="titulo-tiempo" id="titulo-tiempo-casual">TIEMPO</h2>

            <div class="opciones-tiempo">
                <button type="button" id="tiempo-si-casual" aria-pressed="true" class="boton-tiempo-casual seleccionado">
                    SÍ
                </button>

                <span class="separador-tiempo"></span>

                <button type="button" id="tiempo-no-casual" aria-pressed="false" class="boton-tiempo-casual">
                    NO
                </button>
            </div>

            <div class="tiempo-casual" id="tiempo-casual">
                <output id="minutos-casual" for="barra-minutos-casual">9 MIN</output>
                <input type="range" id="barra-minutos-casual" aria-label="Minutos de juego" min="1" max="10" value="9">
            </div>

            <button type="button" id="crear-desafio" class="amigo-casual">
                <span>Enfrentarte a un amigo</span>
                <span class="icono-copiar" aria-hidden="true">▢</span>
            </button>

            <section id="invitacion-desafio" aria-label="Invitación" hidden>
                <label for="enlace-amigo">Mandale este enlace a tu amigo</label>
                <input type="url" id="enlace-amigo" readonly>
                <button type="button" id="copiar-desafio">Copiar enlace</button>
                <a id="jugar-desafio">Empezar mi partida</a>
                <p id="aviso-local" hidden>Con localhost, el enlace solo funciona en esta compu.</p>
            </section>
            <p id="estado-desafio" role="status"></p>

            <a href="../tutorial/tutorial.html?desde=casual" class="boton-tutorial-casual">
                ¿CÓMO SE JUEGA?
            </a>

            <a href="../juego/juego.html" class="boton-jugar-casual" id="jugar-casual">
                JUGAR
            </a>

        </section>

    </main>

    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="modocasual.js"></script>
</body>
</html>
