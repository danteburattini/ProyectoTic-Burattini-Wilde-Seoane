
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Modo Casual</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>

<body class="pagina-casual">

    <header class="header-casual">
        <a href="../home/home.html">
            <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
        </a>

        <h1>MODO CASUAL</h1>
    </header>

    <main class="fondo-casual">

        <div class="panel-casual">

            <div class="titulo-tiempo">TIEMPO</div>

            <div class="opciones-tiempo">
                <button type="button" id="tiempo-si-casual" class="boton-tiempo-casual seleccionado">
                    SÍ
                </button>

                <span class="separador-tiempo"></span>

                <button type="button" id="tiempo-no-casual" class="boton-tiempo-casual">
                    NO
                </button>
            </div>

            <div class="tiempo-casual" id="tiempo-casual">
                <p id="minutos-casual">9 MIN</p>
                <input type="range" id="barra-minutos-casual" min="1" max="10" value="9">
            </div>

            <div class="amigo-casual">
                <span>Enfrentarte a un amigo</span>
                <span class="icono-copiar">▢</span>
            </div>

            <a href="../tutorial/tutorial.html?desde=casual" class="boton-tutorial-casual">
                ¿CÓMO SE JUEGA?
            </a>

            <a href="../juego/juego.html" class="boton-jugar-casual" id="jugar-casual">
                JUGAR
            </a>

        </div>

    </main>

    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="modocasual.js"></script>
</body>
</html>
