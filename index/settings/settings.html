
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Ajustes</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>
<body>
    <div class="pagina">
        <header class="header cabeceraSecundaria">
            <a href="../home/home.html" class="logoSecundario">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>
            <h1 class="titulo">AJUSTES</h1>
        </header>

        <main class="ajustes">
            <section class="cajaAjustes" aria-label="Preferencias de juego">
                <label class="opcionAjustes" for="sfx">
                    <span>SFX</span>
                    <span class="interruptor">
                        <input type="checkbox" id="sfx" checked>
                        <span class="deslizador" aria-hidden="true"></span>
                    </span>
                </label>

                <label class="opcionAjustes" for="musica">
                    <span>MÚSICA</span>
                    <span class="interruptor">
                        <input type="checkbox" id="musica" checked>
                        <span class="deslizador" aria-hidden="true"></span>
                    </span>
                </label>

                <label class="opcionAjustes" for="modoDark">
                    <span>MODO DARK</span>
                    <span class="interruptor">
                        <input type="checkbox" id="modoDark" checked>
                        <span class="deslizador" aria-hidden="true"></span>
                    </span>
                </label>
            </section>
        </main>
    </div>

    <script src="settings.js"></script>
    <script src="../audio.js"></script>
    <script src="../tema.js"></script>
</body>
</html>
