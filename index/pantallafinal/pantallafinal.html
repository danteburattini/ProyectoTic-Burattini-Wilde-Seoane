
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Puntuación Final</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>
<body class="pantallaFinal">
    <div class="pagina">
        <header class="header cabeceraSecundaria">
            <a href="../home/home.html" class="logoSecundario">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>
        </header>

        <main class="contenidoFinal">
            <div class="resultadoFinal">
                <section class="cajaPuntuacion" aria-labelledby="tituloFinal">
                    <h1 id="tituloFinal">PUNTUACIÓN FINAL</h1>

                    <div class="numeroPuntuacion">
                        <output id="puntuacionFinal">--</output>
                        <span class="puntuacionMaxima">/50.000</span>
                    </div>

                    <p id="mensajeFinal" role="status"></p>
                    <details id="detalleRondas" hidden>
                        <summary>Ver respuestas de las cinco rondas</summary>
                        <ol id="rondasFinales"></ol>
                    </details>
                </section>

                <nav class="botonesFinal" aria-label="Opciones después de la partida">
                    <a href="../juego/juego.html" id="repetirPartida" class="botonReiniciar">
                        JUGAR DE NUEVO
                    </a>

                    <a href="../home/home.html" class="botonInicio" aria-label="Volver al inicio">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2 1 11h3v11h6v-7h4v7h6V11h3L12 2z"></path>
                        </svg>
                    </a>
                </nav>
            </div>
        </main>
    </div>

    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="pantallafinal.js"></script>
</body>
</html>
