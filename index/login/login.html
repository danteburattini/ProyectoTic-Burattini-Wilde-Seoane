
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Login</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>
<body>
    <div class="pagina">
        <header class="header cabeceraSecundaria">
            <a href="../home/home.html" class="logoSecundario">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>
            <h1 class="titulo" id="tituloLogin">USUARIO</h1>
        </header>

        <main class="login">
            <form class="cajaLogin" id="formularioLogin">
                <div class="avatarLogin">
                    <svg viewBox="0 0 100 100" fill="#7c8da5">
                        <circle cx="50" cy="29" r="21"></circle>
                        <path d="M17 95c0-26 14-39 33-39s33 13 33 39"></path>
                    </svg>
                </div>

                <label for="email" class="soloLectores">Correo electrónico</label>
                <input type="email" name="email" id="email" placeholder="USUARIO (EMAIL)" autocomplete="email" required>

                <label for="password" class="soloLectores">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="CONTRASEÑA" autocomplete="current-password" required>

                <p id="mensajeLogin" class="mensajeLogin" aria-live="polite"></p>

                <button type="submit" class="botonLogin" id="botonLogin">LOG IN</button>
            </form>

            <button type="button" id="cerrarSesion" class="cambiarLogin" hidden>CERRAR SESIÓN</button>
            <button type="button" class="cambiarLogin" id="cambiarLogin">¿NO TENÉS CUENTA? REGISTRATE</button>

            <a href="../home/home.html" class="volverLogin">VOLVER AL INICIO</a>
        </main>
    </div>

    <script src="../tema.js"></script>
    <script src="login.js"></script>
</body>
</html>
