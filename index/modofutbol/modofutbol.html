
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Fútbol</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>
<body class="pagina-futbol">
    <div class="pagina">
        <header class="header header-secundario futbol-encabezado">
            <a href="../home/home.html" class="logo-secundario">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>
            <img class="futbol-titulo-imagen" src="../../imagenes/modo Futbol.png" alt="Modo Fútbol">
        </header>

        <main class="futbol-fondo">
            <div class="futbol-panel">
                <div class="futbol-tiempo-titulo">TIEMPO</div>

                <div class="futbol-opciones">
                    <button type="button" id="tiempo-si" class="futbol-opcion" aria-pressed="false">SÍ</button>
                    <div class="futbol-separador"></div>
                    <button type="button" id="tiempo-no" class="futbol-opcion futbol-seleccionado" aria-pressed="true">NO</button>
                </div>

                <div class="futbol-duracion" id="futbol-duracion" hidden>
                    <span id="futbol-minutos">9 MIN</span>
                    <input type="range" id="futbol-barra-tiempo" min="1" max="10" value="9">
                </div>

                <a href="../tutorial/tutorial.html?desde=futbol" class="futbol-tutorial">
                    ¿CÓMO SE JUEGA?
                </a>

                <a href="../juego/juego.html" id="futbol-jugar" class="futbol-jugar">
                    JUGAR
                </a>
            </div>
        </main>
    </div>

    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="modofutbol.js"></script>
</body>
</html>
