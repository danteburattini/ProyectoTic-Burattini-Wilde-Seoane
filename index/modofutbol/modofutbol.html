
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Fútbol</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
</head>
<body class="paginaFutbol">
    <div class="pagina">
        <header class="header cabeceraSecundaria futbolEncabezado">
            <a href="../home/home.html" class="logoSecundario">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>
            <h1 class="futbolTitulo"><img class="logoFutbol" src="../../imagenes/modo Futbol.png" alt="Modo Fútbol"></h1>
        </header>

        <main class="futbolFondo">
            <section class="futbolPanel" aria-labelledby="tituloTiempoFutbol">
                <h2 class="tituloTiempoFutbol" id="tituloTiempoFutbol">TIEMPO</h2>

                <div class="futbolOpciones">
                    <button type="button" id="tiempoSi" class="futbolOpcion" aria-pressed="false">SÍ</button>
                    <div class="futbolSeparador"></div>
                    <button type="button" id="tiempoNo" class="futbolOpcion opcionActiva" aria-pressed="true">NO</button>
                </div>

                <div class="futbolDuracion" id="futbolDuracion" hidden>
                    <output id="futbolMinutos" for="futbolBarraTiempo">9 MIN</output>
                    <input type="range" id="futbolBarraTiempo" aria-label="Minutos de juego" min="1" max="10" value="9">
                </div>

                <a href="../tutorial/tutorial.html?desde=futbol" class="futbolTutorial">
                    ¿CÓMO SE JUEGA?
                </a>

                <a href="../juego/juego.html" id="futbolJugar" class="futbolJugar">
                    JUGAR
                </a>
            </section>
        </main>
    </div>

    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="modofutbol.js"></script>
</body>
</html>
