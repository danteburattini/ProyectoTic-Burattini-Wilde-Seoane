
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Juego</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="paginaJuego">
    <div class="pantallaJuego">
        <header class="cabeceraJuego">
            <a href="../home/home.html" class="juegoLogo">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>

            <div class="marcadores">
                <div class="reloj" id="temporizadorJuego">
                    <time id="tiempoRestante" datetime="PT9M">9:00</time>
                </div>

                <div class="ronda">
                    <span>ROUND</span>
                    <strong id="numeroRonda" aria-live="polite">1/5</strong>
                </div>

                <div class="puntos">
                    <span>POINTS</span>
                    <strong id="puntosJuego">0</strong>
                </div>
            </div>
        </header>

        <main class="partida">
            <h1 class="soloLectores">Partida</h1>
            <section class="tablero" aria-label="Foto y respuesta">
                <figure class="fotoRonda">
                    <img src="../../imagenes/modo casual/cromanon 2008.jpg" alt="Fotografía histórica" id="imagenJuego">
                </figure>

                <div class="respuesta">
                    <div id="mapaJuego" aria-label="Mapa de Argentina" role="region"></div>

                    <div class="selectorAnio">
                        <button type="button" id="anioAnterior" aria-label="Año anterior">◀</button>
                        <output id="anioElegido" for="barraAnio">2026</output>
                        <button type="button" id="anioSiguiente" aria-label="Año siguiente">▶</button>
                    </div>

                    <div class="controlAnio">
                        <input type="range" id="barraAnio" aria-label="Año de la fotografía" min="1900" max="2026" value="2026">
                    </div>
                </div>
            </section>

            <div class="pieJuego">
                <button type="button" id="continuarJuego" class="botonContinuar">
                    CONTINUAR
                </button>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="juego.js"></script>
</body>
</html>
