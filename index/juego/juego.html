<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego</title>
  <link rel="stylesheet" href="../estilos/argentumtimeguessr.css">
</head>
<body>

  <header class="game-header">
    <div class="logo-container" style="padding: 10px 20px;">
      <div class="logo-stars">★ ★ ★</div>
      <div class="logo-title">ARGENTUM TIME GUESSER</div>
    </div>
    <div class="game-score-board">
      <div class="score-box score-round">
        <span>ROUND</span>
        <span class="score-val">1/5</span>
      </div>
      <div class="score-box score-points">
        <span>POINTS</span>
        <span class="score-val">0</span>
      </div>
    </div>
  </header>

  <main class="game-content">
    <div class="game-photo-container">
      <img src="https://images.unsplash.com/photo-1517649763962-0c623266ddc0?q=80&w=800" alt="Foto Historica" class="game-photo">
    </div>

    <div class="game-map-container">
      <iframe class="game-map" src="https://maps.google.com/maps?q=Buenos%20Aires&t=&z=5&ie=UTF8&iwloc=&output=embed"></iframe>
      <div class="year-selector">
        <button class="year-btn">◄</button>
        <span>2026</span>
        <button class="year-btn">►</button>
      </div>
    </div>
  </main>

</body>
</html>
