
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentum Time Guesser - Tutorial</title>
    <link rel="stylesheet" href="../../estilos/argentumtimeguessr.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div class="pagina">
        <header class="header cabeceraSecundaria tutorialHeader">
            <a href="../home/home.html" class="logoSecundario">
                <img src="../../imagenes/LOGO.png" alt="Argentum Time Guesser">
            </a>

            <h1 class="titulo tutorialTitulo">TUTORIAL</h1>
        </header>

        <main class="vistaTutorial">
            <div class="tutorialContenedor">

                <section class="tutorialVista portadaTutorial" id="tutorialInicio">
                    <figure class="tutorialFotoInicio">
                        <img src="../../imagenes/modo casual/cromanon 2008.jpg" alt="Fotografía histórica">
                    </figure>

                    <div class="inicioTutorial">
                        <p class="tutorialTexto tutorialTextoInicio">
                            Primero, te dan una foto de un lugar histórico y famoso de Argentina.
                        </p>

                        <button type="button" class="tutorialBoton" id="tutorialEmpezar">
                            SIGUIENTE
                        </button>
                    </div>
                </section>

                <section class="tutorialVista practicaTutorial" id="tutorialExplicacion" hidden>
                    <div class="ejemploTutorial">
                        <figure class="tutorialFotoMapa">
                            <img src="../../imagenes/modo casual/cromanon 2008.jpg" alt="Fotografía histórica">
                        </figure>

                        <p class="tutorialTexto textoPractica" id="tutorialDescripcion">
                            A partir de la foto tenés que ubicar en el mapa dónde creés que fue sacada y, en la línea de tiempo, el año en el que fue sacada.
                        </p>
                    </div>

                    <div class="controlesTutorial">
                        <div id="mapaTutorial" aria-label="Mapa de práctica" role="region"></div>

                        <div class="tutorialSelectorAnio">
                            <button type="button" id="tutorialAnterior" aria-label="Año anterior">◀</button>
                            <output id="tutorialAnio" for="barraTutorial">2026</output>
                            <button type="button" id="siguienteAnio" aria-label="Año siguiente">▶</button>
                        </div>

                        <div class="tutorialBarraAnio">
                            <input type="range" min="1900" max="2026" value="2026" id="barraTutorial" aria-label="Año de práctica">
                        </div>

                        <button type="button" class="tutorialBoton" id="tutorialAvanzar">
                            SIGUIENTE
                        </button>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../tema.js"></script>
    <script src="../audio.js"></script>
    <script src="tutorial.js"></script>
</body>
</html>
