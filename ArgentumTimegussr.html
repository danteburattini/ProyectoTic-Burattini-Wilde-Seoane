<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentum Timeguessr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="argentumtimeguessr.css">
</head>
<body>

  <div class="frame frame-1 active">
    <div class="header">
      <div class="box-small clickable" onclick="goToPage(5)"></div>
      <div class="box-large-black">ARGENTUM TIME GUESSR</div>
      <div class="box-small clickable" onclick="goToPage(1)"></div>
    </div>
    <div class="content-grid">
      <div class="card"></div>
      <div class="card clickable" onclick="goToPage(3)"></div>
      <div class="card clickable" onclick="goToPage(2)"></div>
    </div>
  </div>

  <div class="frame frame-2">
    <div class="top-bar">
      <div class="black-box clickable" onclick="goToPage(0)">ARGENTUM TIME GUESSR</div>
    </div>
    <div class="main-content">
      <div class="form-card">
        <div class="avatar-icon">
          <div class="avatar-head"></div>
          <div class="avatar-body"></div>
        </div>
        <div class="field"></div>
        <div class="field"></div>
        <div class="btn"></div>
      </div>
    </div>
  </div>

  <div class="frame frame-3">
    <div class="top-bar-3">
      <div class="black-box-3 clickable" onclick="goToPage(0)">ARGENTUM TIME GUESSR</div>
    </div>
    <div class="split-content">
      <div class="left-col">
        <div class="media-box"></div>
        <div class="blue-bar clickable" onclick="goToPage(4)"></div>
      </div>
      <div class="right-col">
        <div class="list-card">
          <div class="list-header"></div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame frame-4">
    <div class="top-bar-4">
      <div class="black-box-4 clickable" onclick="goToPage(0)">ARGENTUM TIME GUESSR</div>
    </div>
    <div class="main-content-4">
      <div class="center-card-4">
        <div class="white-box-4"></div>
        <div class="blue-btn-4"></div>
      </div>
    </div>
  </div>

  <div class="frame frame-5">
    <div class="top-bar-5">
      <div class="black-box-5 clickable" onclick="goToPage(0)">ARGENTUM TIME GUESSR</div>
    </div>
    <div class="content-5">
      <div class="photo-col">
        <div class="photo-box">Foto</div>
      </div>
      <div class="side-col">
        <div class="top-rect"></div>
        <div class="map-container">
          <div class="map-top"></div>
          <div class="map-bottom"></div>
          <div class="slider-bar">
            <div class="pin"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame frame-6">
    <div class="back-arrow clickable" onclick="goToPage(0)">&larr;</div>
    <div class="settings-card">
      <div class="settings-header"></div>
      <div class="settings-list">
        <div class="settings-row">
          <div class="setting-bar"></div>
          <div class="toggle-switch">
            <div class="toggle-knob"></div>
          </div>
        </div>
        <div class="settings-row">
          <div class="setting-bar"></div>
          <div class="toggle-switch">
            <div class="toggle-knob"></div>
          </div>
        </div>
        <div class="settings-row">
          <div class="setting-bar"></div>
          <div class="toggle-switch">
            <div class="toggle-knob"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const frames = document.querySelectorAll('.frame');

    function goToPage(index) {
      frames.forEach((frame, i) => {
        if (i === index) {
          frame.classList.add('active');
        } else {
          frame.classList.remove('active');
        }
      });
    }
  </script>

</body>
</html>
