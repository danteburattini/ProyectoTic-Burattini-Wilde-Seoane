<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentum Timeguessr</title>
  <link rel="stylesheet" href="argentumtimeguessr.css">
</head>
<body>

  <div class="frame frame-1">
    <div class="header">
      <div class="box-small"></div>
      <div class="box-large-black"></div>
      <div class="box-small"></div>
    </div>
    <div class="content-grid">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </div>

  <div class="frame frame-2">
    <div class="top-bar">
      <div class="black-box"></div>
    </div>
    <div class="main-content">
      <div class="form-card">
        <div class="field"></div>
        <div class="field"></div>
        <div class="btn"></div>
      </div>
    </div>
  </div>

  <div class="frame frame-3">
    <div class="top-bar-3">
      <div class="black-box-3"></div>
    </div>
    <div class="split-content">
      <div class="left-col">
        <div class="media-box"></div>
        <div class="blue-bar"></div>
      </div>
      <div class="right-col">
        <div class="list-card">
          <div class="list-header"></div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
          <div class="list-row">
            <div class="row-sq"></div>
            <div class="row-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame frame-4">
    <div class="top-bar-4">
      <div class="black-box-4"></div>
    </div>
    <div class="main-content-4">
      <div class="center-card-4">
        <div class="white-box-4"></div>
        <div class="blue-btn-4"></div>
      </div>
    </div>
  </div>

  <div class="frame frame-5">
    <div class="top-bar-5">
      <div class="black-box-5"></div>
    </div>
    <div class="content-5">
      <div class="photo-col">
        <div class="photo-box">Foto</div>
      </div>
      <div class="side-col">
        <div class="top-rect"></div>
        <div class="map-container">
          <div class="map-top"></div>
          <div class="map-bottom"></div>
          <div class="slider-bar">
            <div class="pin"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame frame-6">
    <div class="top-bar-6">
      <div class="black-box-6"></div>
    </div>
    <div class="main-content-6">
      <div class="center-group-6">
        <div class="grey-top-6"></div>
        <div class="row-bottom-6">
          <div class="blue-box-6"></div>
          <div class="brown-box-6"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
